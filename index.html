<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전 세계 수도 맞추기!</title>
    <meta name="description" content="전 세계 나라의 수도를 맞추며 실력을 뽐내보세요!">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="scanline"></div>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="app-container">
        <!-- Start Screen -->
        <div id="start-screen" class="screen active">
            <h1>전 세계 수도 맞추기!</h1>
            <p>전 세계 100개국 중 랜덤으로 10문제가 나옵니다.<br>당신의 지식을 증명해보세요!</p>
            <input type="text" id="nickname-input" placeholder="닉네임" maxlength="12" autocomplete="off">
            <button id="start-btn" class="btn">챌린지 시작</button>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="screen">
            <div class="progress-box">
                <div id="progress-text" style="font-size: 0.9rem; color: var(--accent); margin-bottom: 0.6rem; text-align: right; font-weight: 700; letter-spacing: 0.05em;">QUESTION 01</div>
                <div class="progress-container">
                    <div id="progress-bar" class="progress-bar"></div>
                </div>
            </div>
            <div id="question-text" class="question-text">질문 데이터 로딩 중...</div>
            <div id="options-container" class="options">
                <!-- Options will be generated by JS -->
            </div>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="screen">
            <h1>CHALLENGE RESULT</h1>
            <p id="result-nickname" style="margin-bottom: 0; color: #fff; font-weight: 600;">사용자님</p>
            <div id="score-display" class="score-display">0 / 5</div>
            <div id="badge-container" style="text-align: center; margin-bottom: 1.5rem;">
                <!-- Badge text like 'GENIUS' or 'EXPERT' -->
            </div>
            <p id="feedback-text" style="font-size: 0.95rem; opacity: 0.8;">수고하셨습니다! 결과를 확인해보세요.</p>
            <button id="restart-btn" class="btn" style="width: 100%; margin-bottom: 2rem;">다시 도전하기</button>
            
            <div class="leaderboard">
                <h3><span>RECENT CHALLENGERS</span> <span>SCORE</span></h3>
                <div id="leaderboard-list">
                    <!-- Leaderboard items will be generated by JS -->
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
