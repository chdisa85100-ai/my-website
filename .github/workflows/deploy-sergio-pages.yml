name: Deploy Sergio AI Global Studio

on:
  push:
    branches: [main]
    paths:
      - 'sergio-ai-global-studio/**'
      - '.github/workflows/deploy-sergio-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: sergio-ai-global-studio-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload Sergio site
        uses: actions/upload-pages-artifact@v4
        with:
          path: './sergio-ai-global-studio'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
